# ncraft — nginx location fragment (mount as a panel at /ncraft/).
# Include this INSIDE the `server` block for chiefmonkey.art (drop into your
# Torii Base fragment include dir, or paste the `location` block directly).
# The trailing slash on proxy_pass strips the /ncraft prefix, so:
#   /ncraft/        -> 127.0.0.1:8888/index.html
#   /ncraft/mp      -> 127.0.0.1:8888/mp   (WebSocket multiplayer)
#   /ncraft/js/...  -> 127.0.0.1:8888/js/...

location /ncraft/ {
    proxy_pass http://127.0.0.1:8888/;
    proxy_http_version 1.1;

    # WebSocket upgrade for /ncraft/mp
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

